<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafka Learning Portal</title>
<!-- Biến màu, widget quiz và mô phỏng dùng chung với các bài học -->
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root { --side-w: 300px; --side-bg: #f4efe3; --side-fg: #2a2823; --side-hover: #e9e2d0; --side-active: #1d5fa8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --side-bg: #121116; --side-fg: #dcd8cf; --side-hover: #24222b; --side-active: #7fb2ee; } }
  :root[data-theme="dark"] { --side-bg: #121116; --side-fg: #dcd8cf; --side-hover: #24222b; --side-active: #7fb2ee; }
  html { font-size: 16px; }
  html, body { height: 100%; }
  body { display: flex; overflow: hidden; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }

  /* ---------- sidebar ---------- */
  #side { width: var(--side-w); min-width: var(--side-w); height: 100%; display: flex; flex-direction: column; background: var(--side-bg); color: var(--side-fg); border-right: 1px solid var(--rule); }
  .brand { padding: 1rem 1rem .6rem; cursor: pointer; }
  .brand b { display: block; font-size: 1.05rem; }
  .brand small { color: var(--muted); font-size: .78rem; }
  .overall { padding: 0 1rem .6rem; font-size: .75rem; color: var(--muted); }
  .bar { height: 5px; border-radius: 3px; background: var(--rule); overflow: hidden; margin-top: .25rem; }
  .bar span { display: block; height: 100%; background: var(--ok); }
  .search { padding: 0 1rem .7rem; }
  .search input { width: 100%; font: inherit; font-size: .85rem; padding: .4rem .6rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--fg); }
  #tree { overflow-y: auto; flex: 1; padding-bottom: 2rem; }
  .group-head { display: flex; align-items: center; gap: .4rem; padding: .55rem 1rem; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); cursor: pointer; user-select: none; }
  .group-head .chev { transition: transform .15s; font-size: .6rem; }
  .group.open .chev { transform: rotate(90deg); }
  .group-head .count { margin-left: auto; font-weight: 400; }
  .group .items { display: none; }
  .group.open .items { display: block; }
  .item { display: flex; gap: .5rem; align-items: flex-start; padding: .4rem 1rem .4rem 1.4rem; font-size: .86rem; line-height: 1.35; color: inherit; text-decoration: none; border-left: 3px solid transparent; }
  .item:hover { background: var(--side-hover); }
  .item.active { border-left-color: var(--side-active); background: var(--side-hover); font-weight: 600; }
  .item .tick { flex: none; width: 1rem; height: 1rem; margin-top: .1rem; border: 1px solid var(--muted); border-radius: 50%; font-size: .65rem; line-height: .95rem; text-align: center; cursor: pointer; }
  .item.done .tick { background: var(--ok); border-color: var(--ok); color: var(--bg); }
  .item .kind { flex: none; font-size: .8rem; width: 1rem; text-align: center; }

  /* ---------- main ---------- */
  #main { flex: 1; height: 100%; display: flex; flex-direction: column; min-width: 0; }
  #top { display: flex; align-items: center; gap: .5rem; padding: .55rem 1rem; border-bottom: 1px solid var(--rule); background: var(--bg); flex-wrap: wrap; }
  #crumb { font-size: .82rem; color: var(--muted); flex: 1; min-width: 8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #top button, #top a.btn { font: inherit; font-size: .8rem; padding: .3rem .7rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--card); color: var(--fg); cursor: pointer; text-decoration: none; }
  #top button:disabled { opacity: .45; cursor: default; }
  #top button.on { background: var(--ok-bg); border-color: var(--ok); }
  #menu { display: none; }
  #scroll { overflow-y: auto; flex: 1; }
  #content { max-width: 46rem; margin: 0 auto; padding: 1.8rem 1.2rem 5rem; font-family: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif; font-size: 1.06rem; line-height: 1.6; }
  #content h1 { font-size: 1.7rem; line-height: 1.25; margin-top: 0; }
  #content h2 { font-size: 1.3rem; margin-top: 2.2rem; border-bottom: 1px solid var(--rule); padding-bottom: .2rem; }
  #content h3 { font-size: 1.08rem; margin-top: 1.6rem; }
  #content blockquote { margin: 1rem 0; padding: .5rem 1rem; border-left: 3px solid var(--accent); background: var(--card); color: var(--fg); border-radius: 0 4px 4px 0; }
  #content blockquote p { margin: .3rem 0; }
  #content table { display: block; overflow-x: auto; }
  #content td, #content th { border-bottom: 1px solid var(--rule); padding: .35rem .5rem; vertical-align: top; text-align: left; }
  #content details { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: .4rem .8rem; margin: .6rem 0; }
  #content summary { cursor: pointer; font-family: system-ui, sans-serif; font-size: .88rem; }
  #content code { font-size: .88em; }
  #content pre code { background: none; padding: 0; }
  .callout { font-family: system-ui, sans-serif; font-size: .88rem; background: var(--ctrl); border-radius: 6px; padding: .6rem .9rem; margin: 0 0 1.4rem; }
  .callout a { margin-right: .8rem; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .8rem; margin: 1.2rem 0 2rem; font-family: system-ui, sans-serif; }
  .card { border: 1px solid var(--rule); border-radius: 8px; padding: .8rem 1rem; background: var(--card); cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .card h3 { margin: 0 0 .3rem !important; font-size: .95rem !important; }
  .card p { margin: 0; font-size: .8rem; color: var(--muted); }
  .card .reset { margin-top: .5rem; font: inherit; font-size: .72rem; background: none; border: none; color: var(--muted); cursor: pointer; padding: 0; text-decoration: underline; }
  .portal-quiz { font-family: system-ui, sans-serif; font-size: .95rem; }
  .empty { color: var(--muted); font-style: italic; }
  #content { overflow-wrap: break-word; }
  #content :not(pre) > code { overflow-wrap: anywhere; }

  @media (max-width: 820px) {
    #side { position: fixed; z-index: 10; left: 0; top: 0; padding-top: env(safe-area-inset-top, 0px); transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 24px rgba(0,0,0,.25); }
    body.side-open #side { transform: none; }
    #menu { display: inline-block; }
    #content { padding: 1.2rem 16px 4rem; }
  }
</style>
</head>
<body>
<nav id="side" aria-label="Mục lục khoá học">
  <div class="brand" id="brand"><b id="brandTitle">Kafka Learning Portal</b><small id="brandSub"></small></div>
  <div class="overall"><span id="overallTxt"></span><div class="bar"><span id="overallBar" style="width:0"></span></div></div>
  <div class="search"><input id="search" type="search" placeholder="Tìm bài, mô phỏng, tra cứu..." aria-label="Tìm"></div>
  <div id="tree"></div>
</nav>
<section id="main">
  <div id="top">
    <button id="menu" type="button" aria-label="Mở mục lục">☰</button>
    <span id="crumb"></span>
    <button id="doneBtn" type="button">○ Đánh dấu hoàn thành</button>
    <button id="prevBtn" type="button">← Trước</button>
    <button id="nextBtn" type="button">Tiếp →</button>
  </div>
  <div id="scroll"><article id="content"></article></div>
</section>

<script src="course.js"></script>
<script src="../assets/quiz.js"></script>
<script src="../assets/flow-anim.js"></script>
<script src="../assets/partition-sim.js"></script>
<script src="../assets/ack-sim.js"></script>
<script src="../assets/idempotence-sim.js"></script>
<script src="../assets/commit-sim.js"></script>
<script src="../assets/rebalance-sim.js"></script>
<script src="../assets/error-sim.js"></script>
<script src="../assets/exactly-sim.js"></script>
<script src="../assets/diagram.js"></script>
<script>
(function () {
  var C = window.COURSE;
  var $ = function (id) { return document.getElementById(id); };
  if (!C) { $('content').innerHTML = '<p>Không tìm thấy dữ liệu khoá học. Chạy <code>node scripts/build_portal.mjs</code> rồi mở lại trang.</p>'; return; }

  var ORDER = [];                       // thứ tự phẳng để Trước/Tiếp
  C.groups.forEach(function (g) { g.items.forEach(function (id) { ORDER.push(id); }); });
  var ICON = { intro: '★', lesson: '', sim: '▶', summary: '≡', reference: '§' };
  var current = null;

  // ---------- tiến độ (chỉ là tiện ích theo từng người xem; không có thì vẫn chạy) ----------
  var KEY = 'kafka-portal-done';
  function loadDone() { try { return new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { return new Set(); } }
  function saveDone(s) { try { localStorage.setItem(KEY, JSON.stringify(Array.from(s))); } catch (e) {} }
  var done = loadDone();
  function toggleDone(id) { if (done.has(id)) done.delete(id); else done.add(id); saveDone(done); renderTree($('search').value); syncTop(); renderOverall(); }

  function lessonIds() { return ORDER.filter(function (id) { return C.items[id].kind === 'lesson'; }); }
  function renderOverall() {
    var ls = lessonIds(), n = ls.filter(function (id) { return done.has(id); }).length;
    var pct = ls.length ? Math.round(n * 100 / ls.length) : 0;
    $('overallTxt').textContent = 'Đã học ' + n + '/' + ls.length + ' bài · ' + pct + '%';
    $('overallBar').style.width = pct + '%';
  }

  // ---------- sidebar ----------
  var openGroups = {};
  function renderTree(filter) {
    var f = (filter || '').trim().toLowerCase(), tree = $('tree');
    tree.innerHTML = '';
    C.groups.forEach(function (g, gi) {
      var ids = g.items.filter(function (id) { return !f || C.items[id].title.toLowerCase().indexOf(f) >= 0; });
      if (f && !ids.length) return;
      var hasCurrent = g.items.indexOf(current) >= 0;
      var open = f ? true : (openGroups[gi] !== undefined ? openGroups[gi] : (gi < 2 || hasCurrent));
      var box = document.createElement('div'); box.className = 'group' + (open ? ' open' : '');
      var head = document.createElement('div'); head.className = 'group-head';
      var nd = g.items.filter(function (id) { return done.has(id); }).length;
      head.innerHTML = '<span class="chev">▶</span><span></span><span class="count">' + nd + '/' + g.items.length + '</span>';
      head.children[1].textContent = g.title;
      head.onclick = function () { openGroups[gi] = !box.classList.contains('open'); box.classList.toggle('open'); };
      box.appendChild(head);
      var list = document.createElement('div'); list.className = 'items';
      ids.forEach(function (id) {
        var it = C.items[id];
        var a = document.createElement('a');
        a.className = 'item' + (id === current ? ' active' : '') + (done.has(id) ? ' done' : '');
        a.href = '#' + id;
        a.innerHTML = '<span class="tick" title="Đánh dấu hoàn thành">' + (done.has(id) ? '✓' : '') + '</span><span class="kind"></span><span class="t"></span>';
        a.querySelector('.kind').textContent = ICON[it.kind] || '';
        a.querySelector('.t').textContent = it.title;
        a.querySelector('.tick').addEventListener('click', function (ev) { ev.preventDefault(); ev.stopPropagation(); toggleDone(id); });
        a.addEventListener('click', function () { document.body.classList.remove('side-open'); });
        list.appendChild(a);
      });
      box.appendChild(list);
      tree.appendChild(box);
    });
  }

  // ---------- nội dung ----------
  function md(text) {
    if (window.marked) return marked.parse(text);
    var pre = document.createElement('pre'); pre.textContent = text; return pre.outerHTML; // không tải được marked: hiện thô
  }
  function resolve(base, href) {
    try { return decodeURIComponent(new URL(href, 'http://w/' + base).pathname.slice(1)); } catch (e) { return href; }
  }
  function fixLinks(root, item) {
    root.querySelectorAll('a[href]').forEach(function (a) {
      var h = a.getAttribute('href');
      if (!h || h.charAt(0) === '#') return;
      if (/^[a-z]+:/i.test(h)) { a.target = '_blank'; a.rel = 'noopener'; return; }
      var p = resolve(item.src || 'portal/x.md', h.split('#')[0]);
      if (C.paths[p]) { a.href = '#' + C.paths[p]; return; }
      a.href = '../' + p; a.target = '_blank'; a.rel = 'noopener';  // labs/, research/... mở file gốc
    });
  }
  function mountQuizzes(root, item) {
    root.querySelectorAll('.portal-quiz').forEach(function (el) {
      var q = item.quizzes && item.quizzes[el.dataset.quiz];
      if (q && window.Quiz) Quiz.mount(el, q);
    });
  }
  function link(id, label) { return '<a href="#' + id + '">' + label + '</a>'; }

  function show(id) {
    if (!C.items[id]) id = 'intro';
    current = id;
    var it = C.items[id], c = $('content');
    document.title = it.title + ' · Kafka Learning Portal';
    var head = '';
    if (it.kind === 'lesson') {
      var parts = [];
      (it.sims || []).forEach(function (s) { parts.push(link(s, '▶ Mô phỏng: ' + C.items[s].title)); });
      if (it.summary) parts.push(link(it.summary, '≡ Tóm tắt ôn nhanh'));
      if (parts.length) head = '<div class="callout">' + parts.join('') + '</div>';
    } else if (it.kind === 'sim') {
      head = '<h1>' + esc(it.title) + '</h1>';
    } else if (it.kind === 'summary') {
      head = '<div class="callout">' + link(it.lesson, '← Về bài học') + '</div>';
    }
    var body = md(it.md);
    if (it.kind === 'sim') {
      var from = (it.lessons || []).map(function (l) { return link(l, C.items[l].title); }).join(', ');
      body += '<div id="simHost"></div><p class="empty">Dùng trong: ' + from + '</p>';
    }
    c.innerHTML = head + body;
    if (it.kind === 'intro') c.insertAdjacentHTML('beforeend', '<h2>Các phần</h2><div class="cards" id="cards"></div>');
    fixLinks(c, it);
    mountQuizzes(c, it);
    if (window.Diagram) Diagram.render(c);
    if (it.kind === 'sim' && window[it.api]) window[it.api].mount($('simHost'), it.opts || undefined);
    if (it.kind === 'intro') renderCards();
    $('scroll').scrollTop = 0;
    renderTree($('search').value);
    syncTop();
  }
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function renderCards() {
    var box = $('cards');
    C.groups.forEach(function (g) {
      var first = g.items[0], it = C.items[first];
      if (it.kind === 'intro') return;
      var nd = g.items.filter(function (id) { return done.has(id); }).length;
      var d = document.createElement('div'); d.className = 'card';
      d.innerHTML = '<h3></h3><p></p><div class="bar"><span style="width:' + Math.round(nd * 100 / g.items.length) + '%"></span></div><p></p>';
      d.querySelector('h3').textContent = g.title;
      d.querySelectorAll('p')[0].textContent = g.items.map(function (id) { return C.items[id].title.replace(/:.*$/, ''); }).slice(0, 4).join(' · ') + (g.items.length > 4 ? ' …' : '');
      d.querySelectorAll('p')[1].textContent = nd + '/' + g.items.length + ' hoàn thành';
      d.onclick = function () { location.hash = '#' + first; };
      box.appendChild(d);
    });
    var r = document.createElement('button'); r.className = 'reset'; r.textContent = 'Đặt lại tiến độ';
    // xác nhận ngay trên nút (không dùng confirm(): nhiều khung nhúng chặn hộp thoại)
    r.onclick = function () {
      if (!r.dataset.armed) { r.dataset.armed = '1'; r.textContent = 'Bấm lần nữa để xoá mọi đánh dấu'; setTimeout(function () { if (r.isConnected) { delete r.dataset.armed; r.textContent = 'Đặt lại tiến độ'; } }, 4000); return; }
      done = new Set(); saveDone(done); show('intro'); renderOverall();
    };
    box.parentNode.insertBefore(r, box.nextSibling);
  }

  function syncTop() {
    var it = C.items[current], i = ORDER.indexOf(current);
    var g = C.groups.filter(function (g) { return g.items.indexOf(current) >= 0; })[0];
    $('crumb').textContent = (g ? g.title + ' / ' : '') + it.title;
    $('prevBtn').disabled = i <= 0;
    $('nextBtn').disabled = i >= ORDER.length - 1;
    var d = done.has(current);
    $('doneBtn').textContent = d ? '✓ Đã hoàn thành' : '○ Đánh dấu hoàn thành';
    $('doneBtn').classList.toggle('on', d);
  }

  // ---------- sự kiện ----------
  $('prevBtn').onclick = function () { var i = ORDER.indexOf(current); if (i > 0) location.hash = '#' + ORDER[i - 1]; };
  $('nextBtn').onclick = function () { var i = ORDER.indexOf(current); if (i < ORDER.length - 1) location.hash = '#' + ORDER[i + 1]; };
  $('doneBtn').onclick = function () { toggleDone(current); };
  $('search').oninput = function () { renderTree(this.value); };
  $('menu').onclick = function () { document.body.classList.toggle('side-open'); };
  $('brand').onclick = function () { location.hash = '#intro'; };
  window.addEventListener('hashchange', function () { show(location.hash.replace(/^#\/?/, '')); });

  $('brandTitle').textContent = C.title;
  $('brandSub').textContent = C.subtitle;
  renderOverall();
  show(location.hash.replace(/^#\/?/, '') || 'intro');
})();
</script>
</body>
</html>
