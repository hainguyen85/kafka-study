<svg width="640" height="230" xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 640 230" role="img" aria-label="Producer gửi vào topic driver-locations có 3 partition, consumer group đọc">
<style>
svg { --bg: #fffdf8; --fg: #1c1b19; --muted: #6b665c; --rule: #ddd6c6; --accent: #1d5fa8; --ok: #1b7a3d; --ok-bg: #e6f4ea; --bad: #b3261e; --bad-bg: #fbe9e7; --code-bg: #f3efe4; --card: #fbf8ef; --ctrl: #dfeaf7; --node: #efe7d2; background: var(--bg); font-family: system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { svg { --bg: #17161a; --fg: #ebe8e1; --muted: #a09b90; --rule: #3a3841; --accent: #7fb2ee; --ok: #6fd18c; --ok-bg: #1d3325; --bad: #ff8f86; --bad-bg: #3a1f1d; --code-bg: #25232b; --card: #1f1d24; --ctrl: #1f2f45; --node: #33301f; color-scheme: dark; } }
text { fill: var(--fg); font-size: 13px; }
.muted { fill: var(--muted); font-size: 11.5px; }
.box { stroke: var(--rule); stroke-width: 1.2; }
.ctrl { fill: var(--ctrl); }
.node { fill: var(--node); }
.part { fill: var(--bg); stroke: var(--muted); stroke-width: 1; }
.arrow { stroke: var(--accent); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
.tag { fill: var(--accent); font-weight: 700; font-size: 12px; }
</style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs>
  <rect class="box ctrl" x="10" y="85" width="110" height="60" rx="6"/>
  <text x="65" y="112" text-anchor="middle">Producer</text>
  <text class="muted" x="65" y="130" text-anchor="middle">key = DRV-001</text>

  <text class="muted" x="330" y="18" text-anchor="middle">topic "driver-locations" (3 partition)</text>
  <rect class="part" x="200" y="30" width="260" height="48" rx="4"/>
  <text class="tag" x="208" y="50">P0</text>
  <text class="muted" x="236" y="50">off0 off1 off2 off3 → ghi thêm vào cuối</text>
  <text class="muted" x="208" y="68">DRV-004 …</text>
  <rect class="part" x="200" y="92" width="260" height="48" rx="4"/>
  <text class="tag" x="208" y="112">P1</text>
  <text class="muted" x="236" y="112">off0 off1 off2 off3 → ghi thêm vào cuối</text>
  <text class="muted" x="208" y="130">DRV-001 DRV-001 …</text>
  <rect class="part" x="200" y="154" width="260" height="48" rx="4"/>
  <text class="tag" x="208" y="174">P2</text>
  <text class="muted" x="236" y="174">off0 off1 off2 off3 → ghi thêm vào cuối</text>
  <text class="muted" x="208" y="192">DRV-002 …</text>

  <path class="arrow" d="M120 115 L198 115"/>
  <rect class="box node" x="520" y="85" width="110" height="60" rx="6"/>
  <text x="575" y="112" text-anchor="middle">Consumer</text>
  <text class="muted" x="575" y="130" text-anchor="middle">đọc theo offset</text>
  <path class="arrow" d="M462 115 L518 115"/>
</svg>
