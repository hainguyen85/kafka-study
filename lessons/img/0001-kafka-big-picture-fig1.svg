<svg width="640" height="210" xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 640 210" role="img" aria-label="So sánh gọi trực tiếp và đi qua Kafka">
<style>
svg { --bg: #fffdf8; --fg: #1c1b19; --muted: #6b665c; --rule: #ddd6c6; --accent: #1d5fa8; --ok: #1b7a3d; --ok-bg: #e6f4ea; --bad: #b3261e; --bad-bg: #fbe9e7; --code-bg: #f3efe4; --card: #fbf8ef; --ctrl: #dfeaf7; --node: #efe7d2; background: var(--bg); font-family: system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { svg { --bg: #17161a; --fg: #ebe8e1; --muted: #a09b90; --rule: #3a3841; --accent: #7fb2ee; --ok: #6fd18c; --ok-bg: #1d3325; --bad: #ff8f86; --bad-bg: #3a1f1d; --code-bg: #25232b; --card: #1f1d24; --ctrl: #1f2f45; --node: #33301f; color-scheme: dark; } }
text { fill: var(--fg); font-size: 13px; }
.muted { fill: var(--muted); font-size: 11.5px; }
.box { stroke: var(--rule); stroke-width: 1.2; }
.ctrl { fill: var(--ctrl); }
.node { fill: var(--node); }
.part { fill: var(--bg); stroke: var(--muted); stroke-width: 1; }
.arrow { stroke: var(--accent); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
.tag { fill: var(--accent); font-weight: 700; font-size: 12px; }
</style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs>
  <text class="muted" x="150" y="16" text-anchor="middle">Gọi trực tiếp</text>
  <rect class="box ctrl" x="10" y="80" width="80" height="44" rx="5"/><text x="50" y="106" text-anchor="middle">Order</text>
  <rect class="box node" x="190" y="26" width="110" height="36" rx="5"/><text x="245" y="49" text-anchor="middle">Notification</text>
  <rect class="box node" x="190" y="84" width="110" height="36" rx="5"/><text x="245" y="107" text-anchor="middle">Inventory</text>
  <rect class="box node" x="190" y="142" width="110" height="36" rx="5"/><text x="245" y="165" text-anchor="middle">Analytics</text>
  <path class="arrow" d="M90 95 L188 48"/><path class="arrow" d="M90 102 L188 102"/><path class="arrow" d="M90 110 L188 160"/>
  <text class="muted" x="150" y="198" text-anchor="middle">Order phải biết và chờ từng nơi nhận</text>

  <line x1="320" y1="10" x2="320" y2="200" stroke="var(--rule)"/>

  <text class="muted" x="485" y="16" text-anchor="middle">Qua Kafka</text>
  <rect class="box ctrl" x="335" y="80" width="80" height="44" rx="5"/><text x="375" y="106" text-anchor="middle">Order</text>
  <rect class="box part" x="450" y="55" width="60" height="94" rx="5"/><text x="480" y="107" text-anchor="middle">Kafka</text>
  <rect class="box node" x="540" y="26" width="95" height="36" rx="5"/><text x="587" y="49" text-anchor="middle">Notification</text>
  <rect class="box node" x="540" y="84" width="95" height="36" rx="5"/><text x="587" y="107" text-anchor="middle">Inventory</text>
  <rect class="box node" x="540" y="142" width="95" height="36" rx="5"/><text x="587" y="165" text-anchor="middle">Analytics</text>
  <path class="arrow" d="M415 102 L448 102"/>
  <path class="arrow" d="M512 80 L538 48"/><path class="arrow" d="M512 102 L538 102"/><path class="arrow" d="M512 124 L538 160"/>
  <text class="muted" x="485" y="198" text-anchor="middle">Order chỉ ghi; ai cần thì tự đọc</text>
</svg>
